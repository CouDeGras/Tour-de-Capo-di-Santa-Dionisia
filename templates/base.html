<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour génoise de Capo di Santa Dionisia — {% block title %}{{ t.title_suffix }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="hdr-left">
    <img src="/static/tower-mark.png" alt="" class="hdr-logo">
    <span id="subtitle">{{ t.subtitle }}</span>
  </div>
  <nav class="page-nav">
    <a href="/"{% if active_page == "weather" %} class="active"{% endif %} aria-label="{{ t.nav_weather }}" title="{{ t.nav_weather }}">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="currentColor" d="M21.86 12.5A4.3 4.3 0 0 0 19 11c0-1.95-.68-3.6-2.04-4.96S13.95 4 12 4c-1.58 0-3 .47-4.25 1.43s-2.08 2.19-2.5 3.72c-1.25.28-2.29.93-3.08 1.95S1 13.28 1 14.58c0 1.51.54 2.8 1.61 3.85C3.69 19.5 5 20 6.5 20h12c1.25 0 2.31-.44 3.19-1.31c.87-.88 1.31-1.94 1.31-3.19q0-1.725-1.14-3M16.57 18L14 15.43c-.57.36-1.26.57-2 .57c-2.21 0-4-1.79-4-4s1.79-4 4-4s4 1.79 4 4c0 .74-.21 1.43-.57 2L18 16.57zM14 12c0 1.11-.89 2-2 2s-2-.89-2-2s.9-2 2-2s2 .9 2 2" />
      </svg>
    </a>
    <!-- Station/Irrigation nav icons only show when citrus mode is "on"
         (see dashboard/views.py's citrus_on) -- weather_mqtt.py never
         computes or publishes an irrigation decision while it's off (see
         its own CITRUS_MODE), so there's nothing behind either page worth
         reaching. -->
    {% if citrus_on %}
    <a href="/stations"{% if active_page == "stations" %} class="active"{% endif %} aria-label="{{ t.station_title }}" title="{{ t.station_title }}">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="currentColor" d="M7 5v8l15-2V7zm3 1.91l3 .4v3.38l-3 .4zm6 .8l3 .4v1.78l-3 .4zM5 10v1h1v1H5v9H3V4c0-.55.45-1 1-1s1 .45 1 1v2h1v1H5z" />
      </svg>
    </a>
    <a href="/irrigation"{% if active_page == "irrigation" %} class="active"{% endif %} aria-label="{{ t.nav_irrigation }}" title="{{ t.nav_irrigation }}">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="currentColor" d="M18.5 7.47c-.74.73-.93 1.78-.58 2.68L15 13.07V11c0-.55-.45-1-1-1h-1.03c.03-.17.03-.33.03-.5C13 6.46 10.54 4 7.5 4A5.497 5.497 0 0 0 4 13.74V20c0 .55.45 1 1 1h9c.55 0 1-.45 1-1v-4.11l4.33-4.33c.9.35 1.95.17 2.67-.56zM4.05 10C4.03 9.83 4 9.67 4 9.5C4 7.57 5.57 6 7.5 6S11 7.57 11 9.5c0 .17-.03.33-.05.5z" />
      </svg>
    </a>
    {% endif %}
  </nav>
  <div class="hdr-right">
    <button id="refresh-btn" class="icon-btn" type="button" aria-label="{{ t.refresh_title }}" title="{{ t.refresh_title }}">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="currentColor" d="M24 17.48a2.5 2.5 0 0 1-2.5 2.5L15 20c-1.66 0-3-1.34-3-3c0-1.6 1.26-2.9 2.84-2.98A3.5 3.5 0 0 1 18 12c1.76 0 3.2 1.3 3.45 2.99c.02 0 .03-.01.05-.01a2.5 2.5 0 0 1 2.5 2.5M10 15c0-.55-.45-1-1-1s-1 .45-1 1v1.44c-1.22-1.1-2-2.67-2-4.44c0-2.38 1.39-4.43 3.4-5.4c.37-.18.6-.56.6-.97c0-.71-.73-1.18-1.37-.88C5.89 6.03 4 8.79 4 12c0 2.4 1.06 4.54 2.73 6H5c-.55 0-1 .45-1 1s.45 1 1 1h4c.55 0 1-.45 1-1zm9-9c.55 0 1-.45 1-1s-.45-1-1-1h-4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1s1-.45 1-1V7.56c.98.89 1.68 2.08 1.92 3.44h2.02a7.98 7.98 0 0 0-2.66-5z" />
      </svg>
    </button>
    <button id="config-btn" class="icon-btn" type="button" aria-label="{{ t.config_title }}" title="{{ t.config_title }}">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94c0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6s-1.62 3.6-3.6 3.6" />
      </svg>
    </button>
    <!-- Only shown inside the Electron/AppImage shell (see static/app.js's
         check for window.electronAPI, set by electron/preload.js) -- absent
         entirely for the systemd-deployed dashboard reached from a normal
         browser, where there's no local app process to quit. -->
    <button id="quit-btn" class="icon-btn hidden" type="button" aria-label="{{ t.quit_title }}" title="{{ t.quit_title }}">
      <svg class="icon-default" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="currentColor" d="M16 11h2v2h-2zm-4-8h7c1.11 0 2 .89 2 2v14h1v2H2v-2h8V5c0-1.11.89-2 2-2m0 2v14h7V5z" />
      </svg>
      <svg class="icon-hover" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="currentColor" d="M12 3c-1.11 0-2 .89-2 2H3v14H2v2h20v-2h-1V5c0-1.11-.89-2-2-2zm0 2h7v14h-7zm-7 6h2v2H5z" />
      </svg>
    </button>
  </div>
</header>

<div id="config-overlay" class="config-overlay hidden">
  <div class="config-panel">
    <div class="config-panel-header">
      <span class="card-label">{{ t.config_title }}</span>
      <button id="config-close" class="icon-btn" type="button" aria-label="{{ t.close }}">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M5 5l14 14M19 5L5 19"/>
        </svg>
      </button>
    </div>
    <div class="config-body">
      <!-- Every hidden input feeding this row's icons, kept out of
           .config-icon-row itself -- if they sat between the visible
           buttons in the DOM they'd break the row's "adjacent sibling"
           divider rule below (which relies on every direct child of
           .config-icon-row actually being a visible slot). Values/wiring
           unchanged from before: app.js's generic fields loop still reads/
           writes each by id exactly like it would a <select> or text
           input. -->
      <input type="hidden" id="cfg-lang">
      <input type="hidden" id="cfg-sun-projection">
      <input type="hidden" id="cfg-sun-view">
      <input type="hidden" id="cfg-citrus-mode">
      <input type="hidden" id="cfg-trinity-mode">
      <!-- One icon toolbar, not five separate labeled fields -- each icon
           IS its own button (not a button wrapped in something else), so
           clicking anywhere in its hover-expanded area triggers it, not
           just the small 30px icon. .icon-hover-label (see style.css)
           expands that whole button inline (pushing the rest of the row
           over, claiming its free width -- not a floating popover) until
           it's hovered/focused. Two lines inside the label: .icon-hover-title
           (the field's name, same styling as .config-field-label below)
           and .icon-hover-value (what the option is currently set to, in
           the smaller/dimmer caption styling that used to be
           .config-field-hint) -- clear cache has no value line, it's an
           action not a setting. title/aria-label attributes stay too, for
           the native tooltip and for screen readers. The vertical rule
           between each icon is style.css's .config-icon-row > * + * rule --
           same 1px solid var(--b) line previously drawn once above the
           danger zone, now reused between every icon instead (and hidden
           entirely while any one of them is expanded). -->
      <div class="config-icon-row">
        <!-- No dropdown -- cfg-lang just holds the current locale code,
             cycled by the globe button; app.js's generic fields loop reads/
             writes its .value exactly like it would a <select>'s. -->
        <button id="cfg-lang-btn" class="icon-hover icon-btn" type="button" aria-label="{{ t.field_lang }}" title="{{ t.field_lang }}">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2m6.93 6h-2.95a15.7 15.7 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8M12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96M4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A8 8 0 0 1 5.08 16m2.95-8H5.08a8 8 0 0 1 4.33-3.56A15.7 15.7 0 0 0 8.03 8M12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96M14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2m.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56M16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2z" />
          </svg>
          <span class="icon-hover-label">
            <span class="icon-hover-title">{{ t.field_lang }}</span>
            <span id="cfg-lang-label" class="icon-hover-value">English</span>
          </span>
        </button>
        <!-- cfg-sun-projection holds 'linear'/'orthographic'; the button
             shows only the icon matching that value (see .icon-cycle-btn
             in style.css) and cycles to the other one on click.
             data-labels is the hover text for each data-values entry, same
             order -- app.js's syncCycleBtn shows whichever one matches the
             current value, not the field's own name (see .icon-hover-label
             inside it). -->
        <button type="button" class="icon-hover icon-btn icon-cycle-btn" data-field="sun_projection" data-values="linear,orthographic" data-labels="{{ t.sun_projection_linear }},{{ t.sun_projection_orthographic }}" data-value="linear" aria-label="{{ t.field_sun_projection }}" title="{{ t.field_sun_projection }}">
          <svg class="icon-value-linear" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M15 3v4.59L7.59 15H3v6h6v-4.58L16.42 9H21V3m-4 2h2v2h-2M5 17h2v2H5" />
          </svg>
          <svg class="icon-value-orthographic" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M5 4h2v7h6v6h7v2H5zm2 13h4v-4H7z" />
          </svg>
          <span class="icon-hover-label">
            <span class="icon-hover-title">{{ t.field_sun_projection }}</span>
            <span class="icon-hover-value">{{ t.sun_projection_linear }}</span>
          </span>
        </button>
        <!-- Same pattern, cfg-sun-view holds 'down'/'up'. -->
        <button type="button" class="icon-hover icon-btn icon-cycle-btn" data-field="sun_view" data-values="down,up" data-labels="{{ t.sun_view_down_label }},{{ t.sun_view_up_label }}" data-value="down" aria-label="{{ t.field_sun_view }}" title="{{ t.field_sun_view }}">
          <svg class="icon-value-down" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M14 23.2v-2q2.925 0 4.963-2.037T21 14.2h2q0 1.875-.712 3.513t-1.925 2.85t-2.85 1.925T14 23.2m0-4v-2q1.25 0 2.125-.875T17 14.2h2q0 2.075-1.463 3.538T14 19.2m-8.45 3.375q-.375 0-.75-.15T4.125 22l-3.55-3.55q-.275-.3-.425-.675t-.15-.75q0-.4.15-.763t.425-.637L3.75 12.45q.575-.575 1.425-.587t1.425.562l1.25 1.25l.7-.7l-1.25-1.25q-.575-.575-.575-1.4t.575-1.4L8.725 7.5q.575-.575 1.413-.575t1.412.575l1.25 1.25l.7-.7l-1.25-1.25q-.575-.575-.575-1.412t.575-1.413L15.425.8q.3-.3.675-.45t.75-.15t.738.15t.662.45l3.55 3.55q.3.275.438.638t.137.762q0 .375-.137.75t-.438.675l-3.175 3.175q-.575.575-1.412.575T15.8 10.35L14.55 9.1l-.7.7l1.25 1.25q.575.575.563 1.413t-.588 1.412l-1.4 1.4q-.575.575-1.412.575t-1.413-.575l-1.25-1.25l-.7.7l1.25 1.25q.575.575.563 1.425t-.588 1.425L6.95 22q-.275.275-.638.425t-.762.15m0-1.975l1.05-1.05L3.05 16L2 17.05zm2.125-2.125l1.05-1.05l-3.55-3.55l-1.05 1.05zm9.55-9.55l1.05-1.05l-3.55-3.55l-1.05 1.05zM19.35 6.8l1.05-1.05l-3.55-3.55l-1.05 1.05z" />
          </svg>
          <svg class="icon-value-up" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="m21.9 8.9l-1.7 1l-4-6.9l1.7-1zm-12.1-1l3 5.2l6.1-3.5l-3-5.2zm1.6 4.8l-2-3.5l-4.3 2.5l2 3.5zm-9.3 1.9l1 1.7l2.6-1.5l-1-1.7zm10-.6l-.3-.4l-4.3 2.5l.3.4c.2.3.5.6.8.8L7 22h2l1.4-4.3h.1L12 22h2l-1.9-5.6c.5-.7.5-1.6 0-2.4" />
          </svg>
          <span class="icon-hover-label">
            <span class="icon-hover-title">{{ t.field_sun_view }}</span>
            <span class="icon-hover-value">{{ t.sun_view_down_label }}</span>
          </span>
        </button>
        <!-- Not cosmetic -- this is the master on/off switch for the whole
             irrigation-decision/pump-command pipeline (see
             weather_mqtt.py's CITRUS_MODE and dashboard/views.py's
             citrus_on), deliberately not labeled as such. cfg-citrus-mode
             (hidden) holds "on"/"off" and goes through app.js's generic
             fields load/save loop like any other field; cfg-citrus-label
             shows the on/off state on hover, not the field name, same as
             the other icons -- see app.js. -->
        <button id="cfg-citrus-toggle" class="icon-hover icon-btn" type="button" aria-pressed="false" aria-label="{{ t.field_citrus_mode }}" title="{{ t.field_citrus_mode }}">
          <svg class="icon-citrus-on" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M9 15.9c-2.1-.2-3.9-1-5-2.3c-.8 0-1.6-.5-1.9-1.3s0-1.6.7-2.1c.1-3 2.8-6.1 6.9-7.5S18 2.1 20 4.4c.8 0 1.6.5 1.9 1.3s0 1.6-.7 2.1q0 1.2-.6 2.4C19.4 9.5 18 9 16.5 9c-3.9 0-7.2 3-7.5 6.9m13 .6c0 3-2.5 5.5-5.5 5.5S11 19.5 11 16.5s2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5M13.3 18l2.3-1.5l-2.3-1.5q-.3.75-.3 1.5c0 .75.1 1 .3 1.5m2.7-.6l-2.1 1.4c.5.6 1.3 1 2.1 1.2zm0-4.3c-.8.1-1.6.5-2.1 1.2l2.1 1.4zm1 2.5l2.1-1.4c-.5-.6-1.3-1-2.1-1.2zm2.1 3.2L17 17.4v2.5c.8-.1 1.6-.5 2.1-1.1m.9-2.3q0-.75-.3-1.5l-2.3 1.5l2.3 1.5q.3-.75.3-1.5" />
          </svg>
          <svg class="icon-citrus-off" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M22.1 21.5L2.4 1.7L1.1 3l3.3 3.3c-1 1.2-1.5 2.6-1.6 3.9c-.7.5-1 1.3-.7 2.1s1.1 1.3 1.9 1.3c1.1 1.3 2.9 2.1 5 2.3c.1-1.4.6-2.6 1.3-3.7l1.5 1.5c-.5.8-.8 1.8-.8 2.8c0 3 2.5 5.5 5.5 5.5c1 0 2-.3 2.8-.8l1.5 1.5zm-9.1-5c0-.5.1-.9.3-1.4l1.7 1.7l-1.7 1.2q-.3-.75-.3-1.5m.9 2.3l1.8-1.2l.3.3V20c-.8-.2-1.6-.6-2.1-1.2m3.1 1.1v-1l.8.8c-.3.1-.5.2-.8.2m3-3.1v-.3q0-.75-.3-1.5l-.9.6l-.7-.7l1-.7c-.5-.6-1.3-1-2.1-1.2v.8l-2.4-2.4c.6-.2 1.3-.4 1.9-.4c3 0 5.5 2.5 5.5 5.5c0 .7-.1 1.3-.4 1.9zm-7-7L7.1 3.9c.8-.5 1.7-.9 2.6-1.2C13.8 1.3 18 2.1 20 4.4c.8 0 1.6.5 1.9 1.3s0 1.6-.7 2.1q0 1.2-.6 2.4C19.4 9.5 18 9 16.5 9c-1.2 0-2.4.3-3.5.8" />
          </svg>
          <span class="icon-hover-label">
            <span class="icon-hover-title">{{ t.field_citrus_mode }}</span>
            <span id="cfg-citrus-label" class="icon-hover-value">{{ t.citrus_off_label }}</span>
          </span>
        </button>
        <!-- Trinity mode: same on/off toggle shape as citrus mode above,
             but purely a display preference (see dashboard/services.py's
             TRINITY_MODES) -- it switches weather.html/irrigation.html's
             rain+temp charts between three per-source charts (on) and one
             mean-of-sources chart (off), on both pages at once. cfg-trinity-mode
             (hidden) holds "on"/"off" and goes through app.js's generic
             fields load/save loop; unlike citrus mode this needs no reload
             on save since both chart layouts are always in the DOM already
             (see weather.js's/irrigation.js's applyTrinityMode) -- just a
             visibility swap plus a fresh render pass. -->
        <button id="cfg-trinity-toggle" class="icon-hover icon-btn" type="button" aria-pressed="false" aria-label="{{ t.field_trinity_mode }}" title="{{ t.field_trinity_mode }}">
          <svg class="icon-trinity-on" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M4 12V9c0 2.2 3.6 4 8 4s8-1.8 8-4v3c0 .5-.2.9-.5 1.4c-.8-.3-1.6-.4-2.5-.4c-2.5 0-4.9 1.1-6.4 2.9C6.8 15.6 4 14 4 12m8-1c4.4 0 8-1.8 8-4s-3.6-4-8-4s-8 1.8-8 4s3.6 4 8 4m-2.9 8.7l-.3-.7l.3-.7c.1-.2.2-.3.2-.5c-3.1-.6-5.3-2-5.3-3.8v3c0 1.8 2.4 3.3 5.7 3.8c-.2-.3-.4-.7-.6-1.1M17 18c-.6 0-1 .4-1 1s.4 1 1 1s1-.4 1-1s-.4-1-1-1m6 1c-.9 2.3-3.3 4-6 4s-5.1-1.7-6-4c.9-2.3 3.3-4 6-4s5.1 1.7 6 4m-3.5 0c0-1.4-1.1-2.5-2.5-2.5s-2.5 1.1-2.5 2.5s1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5" />
          </svg>
          <svg class="icon-trinity-off" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="m14.1 10.9l-7-7c1.3-.6 3-.9 4.9-.9c4.4 0 8 1.8 8 4c0 1.9-2.5 3.4-5.9 3.9m2.1 2.1h.8c.9 0 1.7.1 2.5.4c.3-.4.5-.9.5-1.4V9c0 1.5-1.7 2.9-4.3 3.5zm2.2 2.2l4.4 4.4c.1-.2.2-.4.3-.5c-.9-2-2.6-3.5-4.7-3.9m3.7 6.3l-1.3 1.3l-.6-.6c-1 .5-2.1.9-3.2.9c-2.7 0-5.1-1.7-6-4c.6-1.4 1.6-2.5 2.9-3.2l-1.5-1.5c-.7.4-1.3 1-1.9 1.6c-3.7-.4-6.5-2-6.5-4V9c0 2.1 3.1 3.7 7.1 4l-2.3-2.3C6 10 4 8.6 4 7c0-.3.1-.6.2-.9L1.1 3l1.3-1.3zm-3.3-.8l-1.1-1.1c-.1.3-.4.4-.7.4c-.6 0-1-.4-1-1c0-.3.1-.6.4-.8l-1.1-1.1c-.5.5-.8 1.1-.8 1.8c0 1.4 1.1 2.5 2.5 2.5c.7.1 1.4-.2 1.8-.7M8.8 19l.3-.7c.1-.2.2-.3.2-.5c-3.1-.6-5.3-2-5.3-3.8v3c0 1.8 2.4 3.3 5.7 3.8c-.2-.3-.4-.7-.5-1.1z" />
          </svg>
          <span class="icon-hover-label">
            <span class="icon-hover-title">{{ t.field_trinity_mode }}</span>
            <span id="cfg-trinity-label" class="icon-hover-value">{{ t.trinity_on_label }}</span>
          </span>
        </button>
        <!-- Clear cache: was its own "danger zone" section with a border
             above it; now just the last icon in this same row, wiped
             state and all still handled the same way (see app.js and
             dashboard/services.py's api_clear_cache). -->
        <button id="config-clear-cache" class="icon-hover icon-btn" type="button" aria-label="{{ t.field_clear_cache }}" title="{{ t.field_clear_cache }}">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M15 13h1.5v2.82l2.44 1.41l-.75 1.3L15 16.69zm8 3c0 3.87-3.13 7-7 7c-1.91 0-3.64-.76-4.9-2H8c-1.1 0-2-.9-2-2V7h12v2.29c2.89.86 5 3.54 5 6.71m-7-5c-2.76 0-5 2.24-5 5s2.24 5 5 5s5-2.24 5-5s-2.24-5-5-5m3-7v2H5V4h3.5l1-1h5l1 1z" />
          </svg>
          <span class="icon-hover-label">
            <span class="icon-hover-title">{{ t.field_clear_cache }}</span>
          </span>
        </button>
      </div>
      <!-- Station stays visible regardless of citrus mode -- it's the
           airport METAR/forecast source, and weather fetching keeps
           running while citrus mode is off (see weather_mqtt.py's
           CITRUS_MODE -- only the irrigation decision/MQTT publish is
           gated, not the weather fetch itself). -->
      <label class="config-field">
        <span class="config-field-label">{{ t.field_station }}</span>
        <input type="text" id="cfg-station" maxlength="4" pattern="[A-Za-z]{4}" placeholder="ZSNJ" autocapitalize="characters" autocomplete="off" spellcheck="false">
      </label>
      <!-- Broker/topic/password/pump fields only show when citrus mode is
           "on" -- unlike station above, these configure how (and whether)
           the pump gets commanded, which is exactly what's disabled while
           it's off (see dashboard/views.py's citrus_on). app.js's fields
           object is built by looking these up by id, so it already
           tolerates any/all of them being entirely absent from the DOM
           here. -->
      {% if citrus_on %}
      <label class="config-field">
        <span class="config-field-label">{{ t.field_broker }}</span>
        <input type="text" id="cfg-broker">
      </label>
      <label class="config-field">
        <span class="config-field-label">{{ t.field_topic }}</span>
        <input type="text" id="cfg-topic">
      </label>
      <label class="config-field">
        <span class="config-field-label">{{ t.field_aes_key }}</span>
        <input type="text" id="cfg-aes-key" autocomplete="off" spellcheck="false">
      </label>
      <!-- Together these ARE the "100%"/baseline pump duration now
           (target_volume / flow_rate), not a fixed time constant -- see
           weather_mqtt.py's baseline_pump_seconds_normal(). Every scheduled
           event's actual seconds is still a fractional percentage of that,
           unchanged. -->
      <label class="config-field">
        <span class="config-field-label">{{ t.field_pump_flow_rate }}</span>
        <input type="number" id="cfg-pump-flow-rate" min="0.1" step="0.1" inputmode="decimal">
      </label>
      <label class="config-field">
        <span class="config-field-label">{{ t.field_pump_target_volume }}</span>
        <input type="number" id="cfg-pump-target-volume" min="0.1" step="0.1" inputmode="decimal">
      </label>
      {% endif %}
    </div>
    <div class="config-actions">
      <button id="config-cancel" class="btn btn-outline" type="button">{{ t.btn_cancel }}</button>
      <button id="config-save" class="btn btn-solid" type="button">{{ t.btn_save }}</button>
    </div>
  </div>
</div>

<main>
  {% block content %}{% endblock %}
</main>

<script>window.I18N = {{ i18n_json|safe }};</script>
<script src="/static/app.js"></script>
{% block page_script %}{% endblock %}
</body>
</html>
